<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Information</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #1f2937;
      background: #e5e7eb;
      min-height: 100vh;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 1000;
    }

    .modal {
      width: 960px;
      max-width: 100%;
      max-height: calc(100vh - 48px);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: box-shadow 0.25s ease;
    }
    .modal.minimized {
      width: 960px;
      max-width: calc(100% - 48px);
      max-height: none;
      align-items: flex-end;
      background: transparent;
      box-shadow: none;
    }
    .modal.minimized .modal-body,
    .modal.minimized .modal-footer {
      display: none;
    }
    .modal.minimized .modal-header {
      width: auto;
      padding: 8px 10px;
      border-bottom: none;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    .modal.minimized .header-title-group {
      display: none;
    }
    .modal.minimized .header-top {
      justify-content: flex-end;
    }
    .overlay.minimized {
      background: transparent;
      pointer-events: none;
    }
    .overlay.minimized .modal {
      pointer-events: auto;
    }

    .modal-header {
      padding: 16px 20px 14px;
      border-bottom: 1px solid #e5e7eb;
      background: #f8fafc;
      flex-shrink: 0;
    }
    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .header-title-group h1 {
      font-size: 17px;
      font-weight: 600;
      color: #111827;
      line-height: 1.3;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .btn-minimize {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      color: #6b7280;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .btn-minimize:hover { background: #e5e7eb; color: #111827; }
    .btn-minimize svg {
      width: 16px;
      height: 16px;
      display: block;
    }
    .btn-minimize .icon-restore,
    .btn-minimize .btn-label-restore { display: none; }
    .modal.minimized .btn-minimize {
      width: auto;
      height: auto;
      padding: 8px 14px;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
    }
    .modal.minimized .btn-minimize .icon-minimize { display: none; }
    .modal.minimized .btn-minimize .icon-restore,
    .modal.minimized .btn-minimize .btn-label-restore { display: flex; }
    .modal.minimized .btn-minimize .btn-label-restore { display: inline; }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }

    .state-panel { display: none; }
    .state-panel.active { display: block; }

    .loading-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: #6b7280;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: #4b5563; }

    .skeleton-block {
      background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
      height: 14px;
      margin-bottom: 10px;
    }
    .skeleton-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .feedback-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 20px;
      text-align: center;
    }
    .feedback-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 16px;
    }
    .feedback-icon.empty  { background: #f3f4f6; color: #9ca3af; }
    .feedback-icon.error  { background: #fef2f2; color: #dc2626; }
    #panel-empty .feedback-center { padding-top: 24px; }
    .feedback-title {
      font-size: 15px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    .feedback-desc {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 20px;
    }

    .btn-refresh {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 20px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-refresh:hover { background: #2563eb; }
    .btn-refresh:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }
    .btn-refresh .btn-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn-refresh.loading .btn-spinner { display: block; }
    .btn-refresh.loading .btn-label { display: none; }
    .btn-refresh.loading .btn-loading-label { display: inline; }
    .btn-refresh .btn-loading-label { display: none; }

    .retry-hint {
      font-size: 12px;
      color: #6b7280;
      margin-top: 10px;
      display: none;
    }
    .retry-hint.visible { display: block; }

    .account-id-block {
      padding: 4px 0 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 20px;
    }
    @media (max-width: 720px) {
      .field-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .field-grid { grid-template-columns: 1fr; }
    }

    .field-label {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 2px;
    }
    .field-value {
      font-size: 14px;
      color: #111827;
      word-break: break-all;
    }
    .field-item.primary .field-value {
      font-size: 16px;
      font-weight: 600;
      color: #1e40af;
    }

    .modal-footer {
      padding: 10px 20px;
      border-top: 1px solid #e5e7eb;
      background: #f8fafc;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .demo-label {
      font-size: 12px;
      color: #9ca3af;
      margin-right: 4px;
    }
    .demo-btn {
      padding: 4px 12px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      background: #fff;
      font-size: 12px;
      color: #374151;
      cursor: pointer;
      transition: all 0.15s;
    }
    .demo-btn:hover { border-color: #3b82f6; color: #2563eb; }
    .demo-btn.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <div class="header-top">
          <div class="header-title-group">
            <h1 id="modal-title">User Information</h1>
          </div>
          <div class="header-actions">
            <button class="btn-minimize" id="btnToggle" title="Minimize" aria-label="Minimize dialog">
              <span class="icon-minimize" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                  <rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/>
                  <path d="M4 12h8"/>
                </svg>
              </span>
              <span class="icon-restore" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2.5" y="5.5" width="8" height="8" rx="1.5"/>
                  <path d="M6.5 5.5V4.5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-1"/>
                </svg>
              </span>
              <span class="btn-label-restore">Restore</span>
            </button>
          </div>
        </div>
      </div>

      <div class="modal-body" id="modalBody">

        <div class="state-panel active" id="panel-loading">
          <div class="loading-center">
            <div class="spinner"></div>
            <div class="loading-text">Fetching user information</div>
          </div>
          <div style="padding: 0 4px;">
            <div class="skeleton-card">
              <div class="skeleton-block" style="width:30%"></div>
              <div class="skeleton-block" style="width:60%"></div>
              <div class="skeleton-block" style="width:45%"></div>
            </div>
            <div class="skeleton-card">
              <div class="skeleton-block" style="width:40%"></div>
              <div class="skeleton-block" style="width:55%"></div>
            </div>
          </div>
        </div>

        <div class="state-panel" id="panel-success">
          <div class="account-id-block" id="accountIdBlock"></div>
          <div class="field-grid" id="customFields"></div>
        </div>

        <div class="state-panel" id="panel-empty">
          <div class="account-id-block" id="emptyAccountIdBlock"></div>
          <div class="feedback-center">
            <div class="feedback-icon empty">&#8709;</div>
            <div class="feedback-title">There is no information for this user.</div>
          </div>
        </div>

        <div class="state-panel" id="panel-error">
          <div class="feedback-center">
            <div class="feedback-icon error">!</div>
            <div class="feedback-title">Failed to fetch user information. Please try again later</div>
            <div class="feedback-desc">The query service is temporarily unavailable. Try refreshing to retry</div>
            <button class="btn-refresh" id="btnRefresh">
              <span class="btn-spinner"></span>
              <span class="btn-label">Refresh</span>
              <span class="btn-loading-label">Retrying...</span>
            </button>
            <div class="retry-hint" id="retryHint">Retrying user information query, please wait...</div>
          </div>
        </div>

      </div>

      <div class="modal-footer">
        <span class="demo-label">Demo:</span>
        <button class="demo-btn" data-state="loading">loading</button>
        <button class="demo-btn" data-state="success">success</button>
        <button class="demo-btn" data-state="empty">empty</button>
        <button class="demo-btn" data-state="error">error</button>
      </div>
    </div>
  </div>

  <script>
    const MOCK_ACC_ID = "ACC20250625001847";
    const MAX_CUSTOM_FIELDS = 50;

    const mockData = {
      accountId: MOCK_ACC_ID,
      customFields: [
        { label: "Name", value: "John Smith" },
        { label: "Phone", value: "138****6721" },
        { label: "Email", value: "john.smith@example.com" },
        { label: "Region", value: "Chaoyang District, Beijing" },
        { label: "Membership Tier", value: "Standard Member" },
        { label: "Registration Date", value: "2023-08-15" },
        { label: "Channel Source", value: "Online Promotion" },
        { label: "Account Status", value: "Active" },
        { label: "Last Active", value: "Active in last 30 days" },
        { label: "Risk Flag", value: "No risk marker" },
        { label: "Communication Preference", value: "Prefers evening contact, price-sensitive" },
        { label: "Last Inquiry", value: "Enterprise Plan" },
        { label: "Notes", value: "Trial applied; trial expired Dec 2024" }
      ]
    };

    let currentState = "loading";
    let autoTimer = null;
    let isMinimized = false;

    const overlay    = document.getElementById("overlay");
    const modal      = document.getElementById("modal");
    const btnToggle  = document.getElementById("btnToggle");
    const btnRefresh = document.getElementById("btnRefresh");
    const retryHint  = document.getElementById("retryHint");
    const demoBtns   = document.querySelectorAll(".demo-btn");

    const panels = {
      loading: document.getElementById("panel-loading"),
      success: document.getElementById("panel-success"),
      empty:   document.getElementById("panel-empty"),
      error:   document.getElementById("panel-error")
    };

    function getAccIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("accId") || MOCK_ACC_ID;
    }

    function renderFieldItems(fields) {
      return fields.map(f => `
        <div class="field-item${f.primary ? " primary" : ""}">
          <div class="field-label">${f.label}</div>
          <div class="field-value">${f.value}</div>
        </div>
      `).join("");
    }

    function renderSuccess() {
      const accountId = getAccIdFromUrl();
      mockData.accountId = accountId;

      document.getElementById("accountIdBlock").innerHTML = renderFieldItems([
        { label: "Customer ID", value: accountId, primary: true }
      ]);

      const fields = mockData.customFields.slice(0, MAX_CUSTOM_FIELDS).map(f => ({
        label: `eg: ${f.label}`,
        value: `eg: ${f.value}`
      }));
      document.getElementById("customFields").innerHTML = renderFieldItems(fields);
    }

    function renderEmpty() {
      const customerId = getAccIdFromUrl();
      document.getElementById("emptyAccountIdBlock").innerHTML = renderFieldItems([
        { label: "Customer ID", value: customerId, primary: true }
      ]);
    }

    function setState(state) {
      currentState = state;

      Object.keys(panels).forEach(key => {
        panels[key].classList.toggle("active", key === state);
      });

      demoBtns.forEach(btn => {
        btn.classList.toggle("active", btn.dataset.state === state);
      });

      if (state === "success") {
        renderSuccess();
      } else if (state === "empty") {
        renderEmpty();
      }
    }

    function clearAutoTimer() {
      if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    }

    function simulateAutoQuery() {
      clearAutoTimer();
      setState("loading");
      autoTimer = setTimeout(() => {
        setState("success");
      }, 1000);
    }

    function handleRefresh() {
      btnRefresh.classList.add("loading");
      btnRefresh.disabled = true;
      retryHint.classList.add("visible");

      setState("loading");

      clearAutoTimer();
      autoTimer = setTimeout(() => {
        btnRefresh.classList.remove("loading");
        btnRefresh.disabled = false;
        retryHint.classList.remove("visible");
        setState("success");
      }, 1000);
    }

    function updateToggleButton() {
      if (isMinimized) {
        btnToggle.title = "Restore";
        btnToggle.setAttribute("aria-label", "Restore dialog");
      } else {
        btnToggle.title = "Minimize";
        btnToggle.setAttribute("aria-label", "Minimize dialog");
      }
    }

    function clearModalPosition() {
      modal.style.position = "";
      modal.style.top = "";
      modal.style.left = "";
      modal.style.width = "";
      modal.style.margin = "";
    }

    function setMinimized(minimized) {
      if (minimized) {
        const rect = modal.getBoundingClientRect();
        modal.style.position = "fixed";
        modal.style.top = rect.top + "px";
        modal.style.left = rect.left + "px";
        modal.style.width = rect.width + "px";
        modal.style.margin = "0";
      } else {
        clearModalPosition();
      }

      isMinimized = minimized;
      modal.classList.toggle("minimized", minimized);
      overlay.classList.toggle("minimized", minimized);
      updateToggleButton();
    }

    function toggleMinimize() {
      setMinimized(!isMinimized);
    }

    btnToggle.addEventListener("click", toggleMinimize);
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay && !isMinimized) setMinimized(true);
    });
    btnRefresh.addEventListener("click", handleRefresh);

    demoBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        clearAutoTimer();
        const state = btn.dataset.state;
        if (state === "loading") {
          setState("loading");
        } else {
          setState(state);
        }
      });
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        setMinimized(!isMinimized);
      }
    });

    simulateAutoQuery();
  </script>
</body>
</html>
