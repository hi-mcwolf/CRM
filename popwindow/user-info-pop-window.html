<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Info Pop Window</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #1f2937;
      background: #e5e7eb;
      min-height: 100vh;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 1000;
    }
    .overlay.minimized {
      background: transparent;
      pointer-events: none;
    }
    .overlay.minimized .modal {
      pointer-events: auto;
    }

    .modal {
      width: 960px;
      max-width: 100%;
      max-height: calc(100vh - 48px);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal.minimized {
      width: 960px;
      max-width: calc(100% - 48px);
      max-height: none;
      align-items: flex-end;
      background: transparent;
      box-shadow: none;
    }
    .modal.minimized .modal-tabs,
    .modal.minimized .customer-id-bar,
    .modal.minimized .modal-body {
      display: none;
    }
    .modal.minimized .modal-header {
      width: auto;
      padding: 8px 10px;
      border-bottom: none;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    .modal.minimized .header-title-group {
      display: none;
    }
    .modal.minimized .header-top {
      justify-content: flex-end;
    }

    .modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      background: #f8fafc;
      flex-shrink: 0;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header-title-group h1 {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
      line-height: 1.3;
    }
    .header-actions {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .btn-minimize {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      color: #6b7280;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .btn-minimize:hover { background: #e5e7eb; color: #111827; }
    .btn-minimize svg {
      width: 16px;
      height: 16px;
      display: block;
    }
    .btn-minimize .icon-restore,
    .btn-minimize .btn-label-restore { display: none; }
    .modal.minimized .btn-minimize {
      width: auto;
      height: auto;
      padding: 8px 14px;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
    }
    .modal.minimized .btn-minimize .icon-minimize { display: none; }
    .modal.minimized .btn-minimize .icon-restore { display: block; }
    .modal.minimized .btn-minimize .btn-label-restore { display: inline; }

    .customer-id-bar {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      background: #fff;
      flex-shrink: 0;
    }
    .customer-id-label {
      font-size: 13px;
      color: #6b7280;
    }
    .customer-id-value {
      font-size: 16px;
      font-weight: 600;
      color: #1e40af;
      word-break: break-all;
    }

    .modal-tabs {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
      background: #fff;
      flex-shrink: 0;
      padding: 0 8px;
    }
    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 12px 8px;
      font-size: 13px;
      font-weight: 500;
      color: #6b7280;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #111827; }
    .tab-btn.active {
      color: #2563eb;
      border-bottom-color: #2563eb;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 0;
      background: #fff;
    }

    .tab-pane { display: none; padding: 12px 16px 20px; }
    .tab-pane.active { display: block; }

    .block {
      padding: 14px 0;
    }
    .block + .block {
      border-top: 1px solid #e5e7eb;
    }
    .block-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 12px;
    }
    .block-title::before {
      content: "";
      width: 3px;
      height: 14px;
      background: #2563eb;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .field-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px 20px;
    }
    .field-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .field-label {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.4;
    }
    .field-value {
      font-size: 14px;
      color: #111827;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }
    .field-value.accent-red { color: #dc2626; font-weight: 500; }
    .field-value.muted { color: #9ca3af; }

    @media (max-width: 720px) {
      .field-list { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 420px) {
      .field-list { grid-template-columns: 1fr; }
    }

    .block-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 12px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      gap: 10px;
    }
    .block-state .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 16px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-retry:hover { background: #2563eb; }

    .tab-fields {
      padding: 4px 0;
    }

    .benefits-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .benefits-toolbar {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .benefits-filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .benefits-filter-row.type-row {
      justify-content: space-between;
      gap: 12px;
    }
    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .filter-chip {
      border: 1px solid #d1d5db;
      background: #fff;
      color: #374151;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      line-height: 1.4;
    }
    .filter-chip:hover {
      border-color: #3b82f6;
      color: #2563eb;
    }
    .filter-chip.active {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #2563eb;
      font-weight: 500;
    }
    .benefits-total {
      font-size: 12px;
      color: #6b7280;
      white-space: nowrap;
      margin-left: auto;
    }
    .benefits-table-wrap {
      overflow-x: auto;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
    }
    .benefits-table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      font-size: 12px;
    }
    .benefits-table th {
      background: #f8fafc;
      color: #6b7280;
      font-weight: 500;
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
      white-space: nowrap;
    }
    .benefits-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #f3f4f6;
      color: #111827;
      vertical-align: top;
    }
    .benefits-table tr:last-child td {
      border-bottom: none;
    }
    .benefit-id {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
    }
    .activity-name {
      font-size: 12px;
      color: #111827;
      line-height: 1.35;
    }
    .activity-id {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
      word-break: break-all;
    }
    .status-text {
      display: inline-block;
      font-weight: 500;
      white-space: nowrap;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .status-text.pending-claim {
      color: #c2410c;
      background: #ffedd5;
    }
    .status-text.pending-use {
      color: #1d4ed8;
      background: #dbeafe;
    }
    .status-text.used {
      color: #15803d;
      background: #dcfce7;
    }
    .status-text.voided {
      color: #6b7280;
      background: #f3f4f6;
    }
    .dual-line {
      display: flex;
      flex-direction: column;
      gap: 4px;
      white-space: nowrap;
    }
    .dual-line-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .dual-tag {
      display: inline-block;
      min-width: 28px;
      font-size: 11px;
      color: #9ca3af;
    }
    .usage-value {
      font-variant-numeric: tabular-nums;
      color: #ea580c;
    }
    .turnover-value {
      color: #ea580c;
      font-variant-numeric: tabular-nums;
    }
    .turnover-none {
      color: #9ca3af;
    }

    .follow-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .follow-subtabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid #e5e7eb;
    }
    .follow-subtab {
      border: none;
      background: transparent;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      color: #6b7280;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .follow-subtab.active {
      color: #2563eb;
      border-bottom-color: #2563eb;
    }
    .follow-table-wrap {
      overflow-x: auto;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
    }
    .follow-table {
      width: 100%;
      min-width: 640px;
      border-collapse: collapse;
      font-size: 12px;
    }
    .follow-table th {
      background: #f8fafc;
      color: #6b7280;
      font-weight: 500;
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
      white-space: nowrap;
    }
    .follow-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #f3f4f6;
      color: #111827;
      vertical-align: top;
    }
    .follow-table tr:last-child td {
      border-bottom: none;
    }
    .follow-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 12px;
      white-space: nowrap;
    }
    .follow-note,
    .follow-sms {
      max-width: 360px;
      word-break: break-word;
      white-space: pre-wrap;
    }
  </style>
</head>

              tag: "Interested",

            },
            {

              tag: "Call Back Needed",
              smsContent: "We tried to reach you earlier. Please reply a preferred callback time."
            },
            {

              tag: "Needs CS Support",
              smsContent: "Our support team can help with your account. Reply HELP to connect."
            },
            {

              tag: "Not Interested",
              smsContent: "Thanks for your time. You can opt out anytime by replying STOP."
            },
            {

              tag: "Unhappy / Complaint",

    };

    /** @type {Record<string, 'loading'|'success'|'empty'|'failed'>} */
    const blockStates = {};
    /** @type {Record<string, 'loading'|'success'|'empty'|'failed'>} */
    const tabStates = {
      promotion: "loading",
      "follow-up": "loading"
    };

    let isMinimized = false;
    let activeTab = "user-info";
    let benefitsStatusFilter = "All";
    let benefitsTypeFilter = "All types";
    let followUpSubTab = "phone";

    const BENEFIT_STATUSES = [
      "All",
      "Pending claim",
      "Unclaimed expired",
      "Pending use",
      "Claimed unused expired",
      "Used"
    ];
    const BENEFIT_TYPES = [
      "All types",
      "Bet",
      "Rebate",
      "Turnover"
    ];

    const overlay = document.getElementById("overlay");
    const modal = document.getElementById("modal");
    const btnToggle = document.getElementById("btnToggle");
    const tabBar = document.getElementById("tabBar");
    const paneUserInfo = document.getElementById("pane-user-info");
    const panePromotion = document.getElementById("pane-promotion");
    const paneFollowUp = document.getElementById("pane-follow-up");
    const customerIdValue = document.getElementById("customerIdValue");

    function renderCustomerId() {
      const id = mockData.customerId || "—";
      customerIdValue.textContent = id;
      customerIdValue.setAttribute("title", id);
    }

    function hasValue(value) {
      return value !== null && value !== undefined && value !== "";
    }

    function visibleFields(fields) {
      return (fields || []).filter(f => hasValue(f.value));
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderFieldList(fields) {
      const list = visibleFields(fields);
      if (!list.length) return "";

      return `
        <div class="field-list">
          ${list.map(f => {
            const classes = ["field-value"];
            if (f.accent === "red") classes.push("accent-red");
            if (f.muted) classes.push("muted");
            const title = escapeHtml(f.value).replace(/\n/g, " ");
            return `
              <div class="field-row">
                <div class="field-label">${escapeHtml(f.label)}</div>
                <div class="${classes.join(" ")}" title="${title}">${escapeHtml(f.value)}</div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderStateBody(state, retryAttr) {
      if (state === "loading") {
        return `
          <div class="block-state">
            <div class="spinner"></div>
            <div>Loading...</div>
          </div>
        `;
      }
      if (state === "empty") {
        return `<div class="block-state">No information available.</div>`;
      }
      if (state === "failed") {
        return `
          <div class="block-state">
            <div>Failed to load. Please retry.</div>
            <button type="button" class="btn-retry" ${retryAttr}>Retry</button>
          </div>
        `;
      }
      return "";
    }

    function renderBlock(block) {
      const fields = visibleFields(block.fields);
      if (!fields.length && blockStates[block.id] === "success") {
        return "";
      }

      const state = blockStates[block.id] || "loading";
      let body = "";

      if (state === "success") {
        body = renderFieldList(block.fields);
        if (!body) return "";
      } else {
        body = renderStateBody(state, `data-retry-block="${escapeHtml(block.id)}"`);
      }

      return `
        <div class="block" data-block-id="${escapeHtml(block.id)}">
          <h3 class="block-title">${escapeHtml(block.title)}</h3>
          ${body}
        </div>
      `;
    }

    function renderUserInfoTab() {
      const blocks = mockData.tabs.userInfo.blocks
        .map(renderBlock)
        .filter(Boolean)
        .join("");
      paneUserInfo.innerHTML = blocks || `<div class="block-state">No information available.</div>`;
    }

    function statusClass(status) {
      if (status === "Pending claim") return "pending-claim";
      if (status === "Pending use") return "pending-use";
      if (status === "Used") return "used";
      return "voided";
    }

    function formatNumber(n) {
      return Number(n).toLocaleString("en-US");
    }

    function getFilteredBenefits() {
      return (mockData.tabs.benefits.items || []).filter(item => {
        const statusOk = benefitsStatusFilter === "All" || item.status === benefitsStatusFilter;
        const typeOk = benefitsTypeFilter === "All types" || item.type === benefitsTypeFilter;
        return statusOk && typeOk;
      });
    }

    function renderFilterChips(options, activeValue, dataAttr) {
      return options.map(opt => `
        <button
          type="button"
          class="filter-chip${opt === activeValue ? " active" : ""}"
          ${dataAttr}="${escapeHtml(opt)}"
        >${escapeHtml(opt)}</button>
      `).join("");
    }

    function renderDualTimes(firstLabel, firstValue, secondLabel, secondValue) {
      return `
        <div class="dual-line">
          <div class="dual-line-item">
            <span class="dual-tag">${escapeHtml(firstLabel)}</span>
            <span>${escapeHtml(firstValue || "-")}</span>
          </div>
          <div class="dual-line-item">
            <span class="dual-tag">${escapeHtml(secondLabel)}</span>
            <span>${escapeHtml(secondValue || "-")}</span>
          </div>
        </div>
      `;
    }

    function renderBenefitsRows(items) {
      if (!items.length) {
        return `<tr><td colspan="8"><div class="block-state">No information available.</div></td></tr>`;
      }

      return items.map(item => {
        const turnoverHtml = item.turnoverRequired === null || item.turnoverRequired === undefined
          ? `<div class="turnover-none">No turnover required</div>`
          : `<div class="turnover-value">${formatNumber(item.turnoverDone)} / ${formatNumber(item.turnoverRequired)}</div>`;

        return `
          <tr>
            <td>
              <div class="benefit-id" title="${escapeHtml(item.id)}">${escapeHtml(item.id)}</div>
            </td>
            <td>${escapeHtml(item.type)}</td>
            <td>
              <div class="activity-name">${escapeHtml(item.activityName)}</div>
              <div class="activity-id">${escapeHtml(item.activityId)}</div>
            </td>
            <td>
              <span class="status-text ${statusClass(item.status)}">${escapeHtml(item.status)}</span>
            </td>
            <td>
              ${renderDualTimes("Iss", item.issuedAt, "Clm", item.claimedAt)}
            </td>
            <td>
              ${renderDualTimes("Clm", item.claimDeadline, "Use", item.useDeadline)}
            </td>
            <td>
              <div class="usage-value">${formatNumber(item.faceUsed)} / ${formatNumber(item.faceInitial)}</div>
            </td>
            <td>${turnoverHtml}</td>
          </tr>
        `;
      }).join("");
    }

    function renderBenefitsSuccess() {
      const items = getFilteredBenefits();
      return `
        <div class="benefits-panel">
          <div class="benefits-toolbar">
            <div class="benefits-filter-row">
              <div class="filter-chips">
                ${renderFilterChips(BENEFIT_STATUSES, benefitsStatusFilter, "data-benefit-status")}
              </div>
            </div>
            <div class="benefits-filter-row type-row">
              <div class="filter-chips">
                ${renderFilterChips(BENEFIT_TYPES, benefitsTypeFilter, "data-benefit-type")}
              </div>
              <div class="benefits-total">${items.length.toLocaleString("en-US")} rows</div>
            </div>
          </div>
          <div class="benefits-table-wrap">
            <table class="benefits-table">
              <thead>
                <tr>
                  <th>Benefit</th>
                  <th>Type</th>
                  <th>Activity</th>
                  <th>Status</th>
                  <th>Issued / Claimed</th>
                  <th>Claim due / Use due</th>
                  <th>Amount used / initial</th>
                  <th>Turnover done / required</th>
                </tr>
              </thead>
              <tbody>
                ${renderBenefitsRows(items)}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderSimpleTab(pane, tabKey, stateKey, fields) {
      const state = tabStates[stateKey] || "loading";
      if (state !== "success") {
        pane.innerHTML = renderStateBody(state, `data-retry-tab="${escapeHtml(stateKey)}"`);
        return;
      }
      const html = renderFieldList(fields);
      pane.innerHTML = html
        ? `<div class="tab-fields">${html}</div>`
        : `<div class="block-state">No information available.</div>`;
    }

    function renderPromotionTab() {
      const state = tabStates.promotion || "loading";
      if (state !== "success") {
        panePromotion.innerHTML = renderStateBody(state, `data-retry-tab="promotion"`);
        return;
      }
      if (!(mockData.tabs.benefits.items || []).length) {
        panePromotion.innerHTML = `<div class="block-state">No information available.</div>`;
        return;
      }
      panePromotion.innerHTML = renderBenefitsSuccess();
    }

    function renderFollowUpPhoneTable(rows) {
      if (!rows.length) {
        return `<div class="block-state">No information available.</div>`;
      }
      return `
        <div class="follow-table-wrap">
          <table class="follow-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Tag</th>
                <th>Agent Note</th>
                <th>Agent Name</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr>
                  <td>${escapeHtml(row.time)}</td>
                  <td><span class="follow-tag">${escapeHtml(row.tag)}</span></td>
                  <td>
                    <div class="follow-note" title="${escapeHtml(row.agentNote)}">${escapeHtml(row.agentNote)}</div>
                  </td>
                  <td>${escapeHtml(row.agentName)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderFollowUpSmsTable(rows) {
      if (!rows.length) {
        return `<div class="block-state">No information available.</div>`;
      }
      return `
        <div class="follow-table-wrap">
          <table class="follow-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Tag</th>
                <th>SMS Content</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr>
                  <td>${escapeHtml(row.time)}</td>
                  <td><span class="follow-tag">${escapeHtml(row.tag)}</span></td>
                  <td>
                    <div class="follow-sms" title="${escapeHtml(row.smsContent)}">${escapeHtml(row.smsContent)}</div>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderFollowUpSuccess() {
      const phoneActive = followUpSubTab === "phone";
      const tableHtml = phoneActive
        ? renderFollowUpPhoneTable(mockData.tabs.followUp.phoneList || [])
        : renderFollowUpSmsTable(mockData.tabs.followUp.smsList || []);

      return `
        <div class="follow-panel">
          <div class="follow-subtabs">
            <button type="button" class="follow-subtab${phoneActive ? " active" : ""}" data-follow-sub="phone">
              Phone Follow-up List
            </button>
            <button type="button" class="follow-subtab${!phoneActive ? " active" : ""}" data-follow-sub="sms">
              SMS Send List
            </button>
          </div>
          ${tableHtml}
        </div>
      `;
    }

    function renderFollowUpTab() {
      const state = tabStates["follow-up"] || "loading";
      if (state !== "success") {
        paneFollowUp.innerHTML = renderStateBody(state, `data-retry-tab="follow-up"`);
        return;
      }
      const hasPhone = (mockData.tabs.followUp.phoneList || []).length > 0;
      const hasSms = (mockData.tabs.followUp.smsList || []).length > 0;
      if (!hasPhone && !hasSms) {
        paneFollowUp.innerHTML = `<div class="block-state">No information available.</div>`;
        return;
      }
      paneFollowUp.innerHTML = renderFollowUpSuccess();
    }

    function renderAll() {
      renderUserInfoTab();
      renderPromotionTab();
      renderFollowUpTab();
    }

    function switchTab(tabName) {
      activeTab = tabName;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tabName);
      });
      document.querySelectorAll(".tab-pane").forEach(pane => {
        pane.classList.toggle("active", pane.dataset.tab === tabName);
      });
    }

    function setBlockState(blockId, state) {
      blockStates[blockId] = state;
      renderUserInfoTab();
    }

    function setTabState(tabKey, state) {
      tabStates[tabKey] = state;
      if (tabKey === "promotion") renderPromotionTab();
      if (tabKey === "follow-up") renderFollowUpTab();
    }

    function loadBlock(blockId) {
      setBlockState(blockId, "loading");
      setTimeout(() => {
        const block = mockData.tabs.userInfo.blocks.find(b => b.id === blockId);
        if (!block || !visibleFields(block.fields).length) {
          setBlockState(blockId, "empty");
          return;
        }
        setBlockState(blockId, "success");
      }, LOAD_DELAY_MS);
    }

    function loadSimpleTab(tabKey) {
      setTabState(tabKey, "loading");
      setTimeout(() => {
        if (tabKey === "promotion") {
          if (!(mockData.tabs.benefits.items || []).length) {
            setTabState(tabKey, "empty");
            return;
          }
          setTabState(tabKey, "success");
          return;
        }
        const hasPhone = (mockData.tabs.followUp.phoneList || []).length > 0;
        const hasSms = (mockData.tabs.followUp.smsList || []).length > 0;
        if (!hasPhone && !hasSms) {
          setTabState(tabKey, "empty");
          return;
        }
        setTabState(tabKey, "success");
      }, LOAD_DELAY_MS);
    }

    function initLoad() {
      renderCustomerId();
      mockData.tabs.userInfo.blocks.forEach(block => {
        blockStates[block.id] = "loading";
      });
      tabStates.promotion = "loading";
      tabStates["follow-up"] = "loading";
      renderAll();

      mockData.tabs.userInfo.blocks.forEach(block => loadBlock(block.id));
      loadSimpleTab("promotion");
      loadSimpleTab("follow-up");
    }

    function updateToggleButton() {
      if (isMinimized) {
        btnToggle.title = "Restore";
        btnToggle.setAttribute("aria-label", "Restore dialog");
      } else {
        btnToggle.title = "Minimize";
        btnToggle.setAttribute("aria-label", "Minimize dialog");
      }
    }

    function clearModalPosition() {
      modal.style.position = "";
      modal.style.top = "";
      modal.style.left = "";
      modal.style.width = "";
      modal.style.margin = "";
    }

    function setMinimized(minimized) {
      if (minimized) {
        const rect = modal.getBoundingClientRect();
        modal.style.position = "fixed";
        modal.style.top = rect.top + "px";
        modal.style.left = rect.left + "px";
        modal.style.width = rect.width + "px";
        modal.style.margin = "0";
      } else {
        clearModalPosition();
      }

      isMinimized = minimized;
      modal.classList.toggle("minimized", minimized);
      overlay.classList.toggle("minimized", minimized);
      updateToggleButton();
    }

    function toggleMinimize() {
      setMinimized(!isMinimized);
    }

    btnToggle.addEventListener("click", toggleMinimize);

    overlay.addEventListener("click", (e) => {
      if (e.target === overlay && !isMinimized) setMinimized(true);
    });

    tabBar.addEventListener("click", (e) => {
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;
      switchTab(btn.dataset.tab);
    });

    document.getElementById("modalBody").addEventListener("click", (e) => {
      const statusChip = e.target.closest("[data-benefit-status]");
      if (statusChip) {
        benefitsStatusFilter = statusChip.getAttribute("data-benefit-status");
        renderPromotionTab();
        return;
      }
      const typeChip = e.target.closest("[data-benefit-type]");
      if (typeChip) {
        benefitsTypeFilter = typeChip.getAttribute("data-benefit-type");
        renderPromotionTab();
        return;
      }
      const followSub = e.target.closest("[data-follow-sub]");
      if (followSub) {
        followUpSubTab = followSub.getAttribute("data-follow-sub");
        renderFollowUpTab();
        return;
      }
      const retryBlock = e.target.closest("[data-retry-block]");
      if (retryBlock) {
        loadBlock(retryBlock.getAttribute("data-retry-block"));
        return;
      }
      const retryTab = e.target.closest("[data-retry-tab]");
      if (retryTab) {
        loadSimpleTab(retryTab.getAttribute("data-retry-tab"));
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") setMinimized(!isMinimized);
    });

    initLoad();
  </script>
</body>
</html>
